name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 更新日志要按上一个 tag 生成，必须有完整历史
          fetch-depth: 0

      # 1) 导入 Developer ID Application 证书到临时钥匙串
      #    需要的 Secrets：MACOS_CERT_P12（base64 的 .p12）、MACOS_CERT_PASSWORD、KEYCHAIN_PASSWORD
      - name: 导入签名证书
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$CERT_P12" > "$RUNNER_TEMP/cert.p12.b64"
          # -A = 输入是单行（无换行）base64。少了它，openssl 的 base64 解码器按行缓冲，
          # 遇到 >1024 字符的单行会静默输出 0 字节（exit 0），security import 报
          # "One or more parameters passed to a function were not valid."
          openssl base64 -d -A -in "$RUNNER_TEMP/cert.p12.b64" -out "$RUNNER_TEMP/cert.p12"
          if [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "MACOS_CERT_P12 解码后为空：secret 不是合法 base64，或值为空" >&2
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # 没有这一步，codesign 会报 "User interaction is not allowed"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.p12.b64"

      # 2) 准备公证用的 App Store Connect API Key（.p8）
      #    Secrets：ASC_KEY_P8（base64 的 .p8）、ASC_KEY_ID、ASC_ISSUER_ID
      - name: 准备公证密钥
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" | openssl base64 -d -A -out "$KEY_PATH"
          if [ ! -s "$KEY_PATH" ]; then
            echo "ASC_KEY_P8 解码后为空：secret 不是合法 base64，或值为空" >&2
            exit 1
          fi
          chmod 600 "$KEY_PATH"
          {
            echo "ASC_KEY_PATH=$KEY_PATH"
            echo "ASC_KEY_ID=${{ secrets.ASC_KEY_ID }}"
            echo "ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}"
            echo "SIGN_IDENTITY=${{ secrets.SIGN_IDENTITY }}"
            echo "TEAM_ID=${{ secrets.TEAM_ID }}"
            echo "NOTARIZE=1"
          } >> "$GITHUB_ENV"

      # 3) 构建 + 签名 + 公证 + staple（脚本里 SIGN_IDENTITY/NOTARIZE 驱动）
      - name: 构建并签名公证
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: "1"
        run: ./smart-close/package-dmg.sh "$RELEASE_TAG" "$BUILD_NUMBER"

      # 4) Gatekeeper / 公证校验：不通过就让构建失败，别发出坏包
      - name: 校验签名与公证
        run: |
          set -euo pipefail
          APP="smart-close/build/Build/Products/Release/智能退出.app"
          DMG="smart-close/build/智能退出.dmg"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          hdiutil verify "$DMG"

      # 2.5) 准备更新日志：优先 release-notes/<tag>.md，否则用上一个 tag 之后的提交生成。
      #      同一份内容同时给 GitHub Release 和 appcast（Sparkle 更新弹窗），避免两处不一致。
      - name: 准备更新日志
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="release-notes/${TAG_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" "$RUNNER_TEMP/notes.md"
            echo "使用 $NOTES"
          else
            PREV="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
            {
              echo "## 更新内容"
              echo
              if [ -n "$PREV" ]; then
                echo "自 ${PREV} 以来的变更："
                echo
                git log --no-merges --pretty="- %s" "${PREV}..${TAG_NAME}" \
                  | grep -v "chore(appcast)" || true
              else
                git log --no-merges -10 --pretty="- %s" | grep -v "chore(appcast)" || true
              fi
            } > "$RUNNER_TEMP/notes.md"
            echo "未找到 $NOTES，已根据 git log 生成"
          fi
          echo "----- 更新日志 -----"
          cat "$RUNNER_TEMP/notes.md"
          echo "--------------------"

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          DMG_PATH: smart-close/build/智能退出.dmg
          RELEASE_PATH: smart-close/build/SmartClose-${{ github.ref_name }}.dmg
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          cp "$DMG_PATH" "$RELEASE_PATH"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$RELEASE_PATH" --clobber
            gh release edit "$TAG_NAME" --notes-file "$NOTES"
          else
            gh release create "$TAG_NAME" "$RELEASE_PATH" \
              --title "智能退出 $TAG_NAME" \
              --notes-file "$NOTES"
          fi

      # 5) 生成 appcast（下载地址指向自建站点 app.bgm.fun）
      #    顺序很重要：先有可下载的 DMG，再更新 appcast，否则用户会拿到 404
      - name: 生成 appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          DMG_PATH: smart-close/build/智能退出.dmg
          APP_BGM_URL: ${{ secrets.APP_BGM_URL }}
        run: |
          set -euo pipefail
          SPARKLE_VERSION=2.6.4
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          ATTRS=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$DMG_PATH")
          SIG=$(printf '%s' "$ATTRS" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LEN=$(printf '%s' "$ATTRS" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')
          if [ -z "$SIG" ] || [ -z "$LEN" ]; then
            echo "sign_update 输出异常：$ATTRS" >&2
            exit 1
          fi

          URL="${APP_BGM_URL}/SmartClose-${TAG_NAME}.dmg"

          # 基于远端 master 的最新 appcast 合并，避免把上一版条目丢掉
          git fetch origin master
          git checkout -B appcast-update origin/master
          python3 scripts/make-appcast.py \
            --appcast appcast.xml \
            --tag "$TAG_NAME" \
            --build "$BUILD_NUMBER" \
            --dmg-url "$URL" \
            --length "$LEN" \
            --signature "$SIG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"

      # 6) 部署到 app.bgm.fun（FTPS）：先传 DMG（新文件名，不会被用户提前访问），
      #    校验大小无误后再原子替换 appcast.xml，最后才让旧 feed 指向新版本。
      - name: 部署到 app.bgm.fun
        env:
          FTP_HOST: ${{ secrets.APP_BGM_FTP_HOST }}
          FTP_USER: ${{ secrets.APP_BGM_FTP_USER }}
          FTP_PASS: ${{ secrets.APP_BGM_FTP_PASS }}
          APP_BGM_URL: ${{ secrets.APP_BGM_URL }}
          TAG_NAME: ${{ github.ref_name }}
          DMG_PATH: smart-close/build/SmartClose-${{ github.ref_name }}.dmg
          APPCAST: ${{ runner.temp }}/appcast.xml
          KEEP_DMGS: "5"
        run: |
          set -euo pipefail
          FTP="ftp://${FTP_HOST}"
          AUTH=(--ssl-reqd --user "$FTP_USER:$FTP_PASS")
          put()   { curl -fsS "${AUTH[@]}" --max-time 600 -T "$1" "${FTP}/$2"; }
          # RNFR/RNTO 原子替换；RNTO 可直接覆盖同名文件，
          # 注意别用 --quote "-DELE ..."：curl 会把带减号的命令放到传输之后执行，反而删掉刚改好的文件
          publish() {
            curl -fsS "${AUTH[@]}" --max-time 120 \
              --quote "RNFR $1" --quote "RNTO $2" "${FTP}/" -o /dev/null
          }

          NAME="SmartClose-${TAG_NAME}.dmg"
          LOCAL_SIZE=$(stat -f%z "$DMG_PATH")
          echo "上传 ${NAME}（${LOCAL_SIZE} 字节）…"
          put "$DMG_PATH" ".upload-${NAME}"
          publish ".upload-${NAME}" "$NAME"

          REMOTE_SIZE=$(curl -fsSI "${APP_BGM_URL}/${NAME}" | tr -d '\r' \
            | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
          if [ "$LOCAL_SIZE" != "$REMOTE_SIZE" ]; then
            echo "✗ 线上文件大小不一致：本地 $LOCAL_SIZE / 线上 ${REMOTE_SIZE:-未知}" >&2
            exit 1
          fi
          echo "✔ DMG 已可用：${APP_BGM_URL}/${NAME}"

          echo "上传 appcast.xml …"
          put "$APPCAST" ".appcast.xml.${TAG_NAME}"
          publish ".appcast.xml.${TAG_NAME}" "appcast.xml"

          if ! curl -fsS "${APP_BGM_URL}/appcast.xml" | grep -q "SmartClose-${TAG_NAME}.dmg"; then
            echo "✗ 线上 appcast.xml 未包含本次版本" >&2
            exit 1
          fi
          echo "✔ appcast 已更新：${APP_BGM_URL}/appcast.xml"

          # 只保留最近 KEEP_DMGS 个安装包，避免磁盘被历史版本占满
          LIST=$(curl -fsS "${AUTH[@]}" --max-time 120 "${FTP}/" \
            | awk '{print $NF}' | grep -E '^SmartClose-v.*\.dmg$' | sort -V)
          TOTAL=$(printf '%s\n' "$LIST" | grep -c . || true)
          TOTAL=${TOTAL:-0}
          DROP=$((TOTAL - KEEP_DMGS))
          if [ "$DROP" -gt 0 ]; then
            printf '%s\n' "$LIST" | head -n "$DROP" | while read -r old; do
              echo "清理旧版本：$old"
              curl -fsS "${AUTH[@]}" --max-time 60 -Q "-DELE $old" "${FTP}/" -o /dev/null
            done
          fi
          printf '%s\n' "$LIST" | tail -5

      # 7) 把 appcast 也提交回仓库：老用户仍从 GitHub 的 feed 检查更新，
      #    两边内容一致，他们升级后才会切到自建域名
      - name: 提交 appcast 回 master
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --staged --quiet; then
            echo "appcast 无变化，跳过提交"
          else
            git commit -m "chore(appcast): ${TAG_NAME}"
            git push origin HEAD:master
          fi

      - name: 清理钥匙串
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
