name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./smart-close/package-dmg.sh "$RELEASE_TAG" "$BUILD_NUMBER"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          DMG_PATH: smart-close/build/智能退出.dmg
          RELEASE_PATH: smart-close/build/SmartClose-${{ github.ref_name }}.dmg
        run: |
          cp "$DMG_PATH" "$RELEASE_PATH"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$RELEASE_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$RELEASE_PATH" \
              --title "智能退出 $TAG_NAME" \
              --generate-notes
          fi
